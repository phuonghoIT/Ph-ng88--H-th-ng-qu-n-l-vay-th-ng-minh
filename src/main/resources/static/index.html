<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HFinance Frontend</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
    <header class="app-header">
        <div>
            <span class="brand">HFinance System</span>
            <span id="roleBadge" class="badge hidden"></span>
        </div>
        <div id="userBar" class="user-bar hidden">
            <span id="userLabel"></span>
            <button id="logoutBtn" class="button secondary">Đăng xuất</button>
        </div>
    </header>

    <main class="app-main">
        <div id="message" class="message hidden"></div>
        <div id="view"></div>
    </main>
</div>
<script src="app.js"></script>
</body>
</html>
