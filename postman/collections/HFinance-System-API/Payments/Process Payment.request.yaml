    {
      "amount": 5000000,
      "paymentDate": "2026-06-05",
      "paymentMethod": "Chuyển khoản",
      "repaymentSchedule": {"scheduleId": 1},
      "employee": {"employeeId": 1}
    }
  options:
    raw:
      language: json
